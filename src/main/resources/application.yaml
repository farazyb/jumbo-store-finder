spring:
  application:
    name: store-finder
  mvc:
    problemdetails:
      enabled: true

logging:
  file:
    name: logs/store-finder.log
  structured:
    format:
      file: ecs
    json:
      exclude:
        - process
        - service
        - ecs

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,storeData
